  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>Result<\u002Fspan><span style=\"text-wrap:pretty\">{{ p.result }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ p.recognition }}\" hint-placeholder-val=\"{{ false }}\"><p data-reveal=\"up\" style=\"margin:0\"><strong style=\"color:#010101;font-weight:600\">Recognition — <\u002Fstrong>{{ p.recognition }}<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(16px,2vw,28px);margin-top:clamp(48px,8vh,88px)\">\n        <sc-for list=\"{{ p.images }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <figure style=\"margin:0\"><div data-reveal=\"clip\" style=\"position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#F6F1EB\"><image-slot id=\"{{ s.id }}\" shape=\"rect\" placeholder=\"{{ s.t }}\"><\u002Fimage-slot><\u002Fdiv><figcaption style=\"margin-top:10px;font-size:14px;color:#6B635B\">{{ s.t }}<\u002Ffigcaption><\u002Ffigure>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ p.note }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:16px 0 0;font-size:13px;color:#6B635B\">{{ p.note }}<\u002Fp><\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ p.next.open }}\" data-cursor=\"Next\" style=\"margin-top:clamp(72px,12vh,140px);width:100%;background:none;border:0;border-top:1px solid #010101;padding:28px 0 0;cursor:pointer;text-align:left;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;transition:color .3s\" style-hover=\"color:#D64A1B\">\n        <span><span style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B;margin-bottom:12px\">Next project<\u002Fspan><span style=\"font-size:clamp(36px,7vw,100px);font-weight:500;letter-spacing:-0.055em;line-height:.9\">{{ p.next.title }}<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:clamp(36px,6vw,80px);line-height:1\">→<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHow }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"How I work\" style=\"padding:0 clamp(20px,5vw,72px) clamp(60px,10vh,120px)\"><section ref=\"{{ heroRef }}\" style=\"position:relative;margin:0 calc(clamp(20px,5vw,72px) * -1) clamp(36px,6vh,64px);min-height:clamp(540px,88vh,920px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(100px,14vh,150px) clamp(20px,5vw,72px) clamp(28px,5vh,56px)\"><canvas ref=\"{{ glRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><\u002Fcanvas><div style=\"position:absolute;inset:0;background:linear-gradient(to top,#FFFFFF 0%,rgba(255,255,255,.8) 20%,rgba(255,255,255,0) 55%);pointer-events:none\"><\u002Fdiv><div style=\"position:relative\">\n      <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B;margin-bottom:20px\">Process<\u002Fdiv>\n      <h1 data-reveal=\"up\" style=\"margin:0;max-width:13ch;font-weight:500;font-size:clamp(46px,8.6vw,136px);line-height:.92;letter-spacing:-0.055em\">How I make <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.02em;color:#D64A1B\">design decisions.<\u002Fspan><\u002Fh1><\u002Fdiv><\u002Fsection>\n      <section style=\"margin-top:clamp(56px,10vh,120px)\">\n        <div style=\"display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B\"><span>Four questions I ask on every project<\u002Fspan><span>Tap to open<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ q.toggle }}\" sc-camel-on-mouse-enter=\"{{ q.hover }}\" style=\"cursor:pointer;border-top:1px solid #010101;padding:clamp(18px,3vh,30px) 0\">\n            <div style=\"display:flex;gap:clamp(14px,3vw,40px);align-items:baseline\">\n              <span style=\"flex:none;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(22px,2.4vw,34px);color:{{ q.numColor }};transition:color .3s\">{{ q.n }}<\u002Fspan>\n              <span style=\"flex:1;font-size:clamp(24px,3.4vw,50px);font-weight:500;letter-spacing:-0.04em;line-height:1.05\">{{ q.q }}<\u002Fspan>\n              <span style=\"flex:none;font-size:28px;line-height:1;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform:rotate({{ q.rot }})\">+<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-rows:{{ q.rows }};transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1)\">\n              <div style=\"overflow:hidden\"><p style=\"margin:0;padding:16px 0 0 clamp(36px,5.4vw,74px);max-width:720px;font-size:clamp(16px,1.3vw,19px);line-height:1.55;color:#2E2925\">{{ q.a }}<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <p data-reveal=\"up\" style=\"margin:0;padding-top:24px;border-top:1px solid #010101;font-size:15px;color:#6B635B;max-width:620px\">The methods change with the problem — interviews, competitive analysis, usability testing, analytics — but those four questions don't.<\u002Fp>\n      <\u002Fsection>\n      <section style=\"margin-top:clamp(80px,14vh,160px)\">\n        <h2 data-reveal=\"up\" style=\"margin:0 0 36px;font-weight:500;font-size:clamp(34px,5vw,72px);letter-spacing:-0.045em;line-height:1\">How I lead<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px\">\n          <sc-for list=\"{{ howLead }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div data-reveal=\"up\" data-d=\"{{ l.d }}\" style=\"border:1px solid rgba(1,1,1,.16);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:32px;min-height:220px;justify-content:space-between;transition:background .35s,color .35s,border-color .35s\" style-hover=\"background:#010101;color:#FFFFFF;border-color:#010101\">\n              <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:22px\">{{ l.n }}<\u002Fspan>\n              <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px\">{{ l.t }}<\u002Fdiv><div style=\"font-size:15px;line-height:1.5;opacity:.72\">{{ l.b }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"margin-top:clamp(80px,14vh,160px);background:#F6F1EB;border-radius:clamp(20px,3vw,36px);padding:clamp(28px,5vw,72px)\">\n        <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B;margin-bottom:18px\">How I work with AI<\u002Fdiv>\n        <h2 data-reveal=\"up\" style=\"margin:0 0 clamp(32px,5vh,56px);max-width:16ch;font-weight:500;font-size:clamp(32px,4.8vw,72px);letter-spacing:-0.045em;line-height:1\">I design AI products, <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.02em;color:#D64A1B\">and I design with AI.<\u002Fspan><\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(20px,3vw,40px)\">\n          <div data-reveal=\"up\" style=\"border-top:1px solid #010101;padding-top:18px\"><div style=\"font-size:18px;font-weight:600;margin-bottom:10px\">Designing AI products<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.55;color:#2E2925\">Aimate taught me the hard parts of AI UX — showing uncertainty honestly, comparing model outputs, and making AI results trustworthy and actionable.<\u002Fp><\u002Fdiv>\n          <div data-reveal=\"up\" data-d=\"80\" style=\"border-top:1px solid #010101;padding-top:18px\"><div style=\"font-size:18px;font-weight:600;margin-bottom:10px\">Designing with AI<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.55;color:#2E2925\">I use AI to speed up research synthesis, explore layout directions and produce product videos, then apply my own judgment to what ships. My everyday tools: Claude for research synthesis and writing, Claude Design and AI video generators for product demos, and Google Vids for voiceovers.<\u002Fp><\u002Fdiv>\n          <div data-reveal=\"up\" data-d=\"160\" style=\"border-top:1px solid #010101;padding-top:18px\"><div style=\"font-size:18px;font-weight:600;margin-bottom:10px\">Training<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.55;color:#2E2925\">Certified in AI-Enhanced Design and GenAI for UI/UX (2024).<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"clip\" style=\"position:relative;margin-top:clamp(32px,5vh,56px);aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#FFFFFF\"><image-slot id=\"how-ai-recording\" shape=\"rect\" placeholder=\"Screen recording — working with AI on a real design problem (3–5 min)\"><\u002Fimage-slot><\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"margin-top:clamp(80px,14vh,160px);text-align:center\">\n        <p data-reveal=\"up\" style=\"margin:0 auto;max-width:18ch;font-family:'Instrument Serif',serif;font-size:clamp(38px,6.4vw,100px);line-height:.98;letter-spacing:-0.02em\">“The best design decisions I've made were about <span style=\"font-style:italic;color:#D64A1B\">what to remove.<\u002Fspan>”<\u002Fp>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"About\" style=\"padding:0 clamp(20px,5vw,72px) clamp(60px,10vh,120px)\"><section ref=\"{{ heroRef }}\" style=\"position:relative;margin:0 calc(clamp(20px,5vw,72px) * -1) clamp(36px,6vh,64px);min-height:clamp(540px,88vh,920px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(100px,14vh,150px) clamp(20px,5vw,72px) clamp(28px,5vh,56px)\"><canvas ref=\"{{ glRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><\u002Fcanvas><div style=\"position:absolute;inset:0;background:linear-gradient(to top,#FFFFFF 0%,rgba(255,255,255,.8) 20%,rgba(255,255,255,0) 55%);pointer-events:none\"><\u002Fdiv><div style=\"position:relative\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,72px);align-items:flex-end\">\n        <div style=\"flex:2 1 440px\">\n          <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B;margin-bottom:20px\">About<\u002Fdiv>\n          <h1 data-reveal=\"up\" style=\"margin:0;font-weight:500;font-size:clamp(38px,6.2vw,96px);line-height:.96;letter-spacing:-0.05em;text-wrap:balance\">I'm Aditi. I make complex products feel simple — <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.02em;color:#D64A1B\">and I measure whether they do.<\u002Fspan><\u002Fh1>\n        <\u002Fdiv>\n        <div data-reveal=\"clip\" style=\"flex:1 1 240px;max-width:380px;position:relative;aspect-ratio:4/5;border-radius:clamp(18px,2vw,28px);overflow:hidden;background:#F6F1EB\"><image-slot id=\"about-portrait\" shape=\"rect\" placeholder=\"Portrait of Aditi\"><\u002Fimage-slot><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n      <section style=\"margin-top:clamp(72px,12vh,140px);display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,88px)\">\n        <div style=\"flex:1 1 200px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B\">(01) My story<\u002Fdiv>\n        <div style=\"flex:3 1 520px;max-width:820px;display:flex;flex-direction:column;gap:24px\">\n          <p data-reveal=\"up\" style=\"margin:0;font-size:clamp(22px,2.4vw,34px);line-height:1.25;letter-spacing:-0.025em;text-wrap:pretty\">I trained as a designer at the Uttar Pradesh Institute of Design, and started my career in 2020 as a graphic designer — first at Samagra Foundation, then at Yantromintra. That early work taught me something most product designers learn late: <span style=\"font-family:'Instrument Serif',serif;font-style:italic;color:#D64A1B\">design has to earn attention, and it has to move a number.<\u002Fspan><\u002Fp>\n          <p data-reveal=\"up\" style=\"margin:0;font-size:clamp(16px,1.3vw,19px);line-height:1.62;color:#2E2925;text-wrap:pretty\">Over the next five years I moved into product design and took on steadily bigger problems. I joined Centricity WealthTech in its first months, and as it grew into India's largest assisted wealthtech platform I spent over three years turning wealth-management workflows — many of them living in Excel — into products relationship managers and investors could actually use. Today at ZenTrades.AI, I lead design across a field-service SaaS platform: its design system, 15+ product dashboards, and its marketing websites.<\u002Fp>\n          <p data-reveal=\"up\" style=\"margin:0;font-size:clamp(16px,1.3vw,19px);line-height:1.62;color:#2E2925;text-wrap:pretty\">Along the way I did something that changed how I think about design: I designed and launched my own AI product, Aimate. Being the founder, the designer and the person selling it made me ruthless about one question — does this help someone decide faster?<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:clamp(72px,12vh,140px);display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,88px)\">\n        <div style=\"flex:1 1 200px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B\">(02) How I lead<\u002Fdiv>\n        <div style=\"flex:3 1 520px;max-width:820px\">\n          <sc-for list=\"{{ aboutLead }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div data-reveal=\"up\" style=\"display:flex;gap:20px;padding:20px 0;border-top:1px solid rgba(1,1,1,.14)\"><span style=\"flex:none;width:30px;font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#D64A1B\">{{ l.n }}<\u002Fspan><div><div style=\"font-size:clamp(19px,1.7vw,24px);font-weight:500;letter-spacing:-0.02em;margin-bottom:6px\">{{ l.t }}<\u002Fdiv><div style=\"font-size:16px;line-height:1.55;color:#2E2925\">{{ l.b }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:clamp(72px,12vh,140px)\">\n        <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:32px\"><h2 data-reveal=\"up\" style=\"margin:0;font-weight:500;font-size:clamp(32px,4.6vw,68px);letter-spacing:-0.045em;line-height:1\">Principles I design by<\u002Fh2><span style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6B635B\">(03)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\">\n          <sc-for list=\"{{ principles }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div data-reveal=\"up\" data-d=\"{{ l.d }}\" style=\"position:relative;overflow:hidden;border-radius:20px;background:#F6F1EB;padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;transition:background .4s,color .4s,transform .5s cubic-bezier(.2,.8,.2,1)\" style-hover=\"background:#D64A1B;color:#FFFFFF;transform:translateY(-6px) rotate(-1deg)\">\n              <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:44px;line-height:1\">{{ l.n }}<\u002Fspan>\n              <div><div style=\"font-size:22px;font-weight:600;letter-spacing:-0.025em;line-height:1.1;margin-bottom:10px\">{{ l.t }}<\u002Fdiv><div style=\"font-size:15px;line-height:1.5;opacity:.8\">{{ l.b }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:clamp(72px,12vh,140px)\">\n        <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px\"><h2 data-reveal=\"up\" style=\"margin:0;font-weight:500;fo
