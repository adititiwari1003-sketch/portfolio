=\"backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);background:transparent;transition:backdrop-filter .15s,background .15s\"><\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font-size:12px;color:#B3A79B\">Run your cursor across the glass.<\u002Fdiv>\n    <div style=\"margin-top:24px;font-size:13px;color:#B3A79B\">© 2026<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;customCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;}}\">\nconst FLAG = [\n  { id: \"aimate\", title: \"Aimate\", domain: \"AI SaaS\", role: \"Founder & sole Product Designer\",\n    card: \"Designed and launched an AI product from zero.\", cardSub: \"AI visibility platform · Founder & sole Product Designer\",\n    metric: \"Zero to paid, as founder and sole designer\", imgHint: \"Aimate — dashboard\",\n    resultLine: \"I designed and launched Aimate, an AI-visibility platform, from blank page to a live product with paid plans — as founder and sole designer.\",\n    metrics: [{ v: \"0 → paid\", l: \"Live SaaS with tiered plans\" }, { v: \"8 × 8\", l: \"Modules × roles designed\" }, { v: \"+1\", l: \"Standalone chatbot product spun off\" }],\n    glance: [[\"Role\", \"Founder & sole Product Designer\"], [\"Team\", \"Sole designer\"], [\"Timeline\", \"Live since 2026\"], [\"Platform\", \"Web app (8 modules, 8 roles) + marketing site\"], [\"Outcome\", \"Live, paid SaaS; spun off a standalone chatbot product\"]],\n    team: \"Sole designer, end to end.\",\n    problem: \"Buyers now ask ChatGPT, Gemini and Perplexity which company to hire. Businesses can't see whether they appear in those answers, or why a competitor does. The raw data is spread across six AI engines, hundreds of prompts and Google Search Console. The business problem: that data is worthless unless a non-technical owner can act on it.\",\n    success: \"A new user should understand where they stand — visible or not, who beats them, what to fix — on their first dashboard, without a walkthrough.\",\n    did: [\"Defined the product: the information architecture for 8 modules and permissions for 8 roles, from Super Admin to Read-Only Analyst.\", \"Designed every screen of the web app, the onboarding flow and the marketing site.\", \"Created the brand: logo, navy-and-orange identity and the robot mascot.\", \"Took it to market myself — which fed real customer questions straight back into the design.\"],\n    constraints: [\"AI answers change daily and some engines don't return data, so the UI had to handle gaps honestly.\", \"Dense B2B data had to stay readable for small-business owners, not just analysts.\", \"One designer, no research budget: customer conversations were the research.\"],\n    hardTitle: \"Show the gap, or fill it\",\n    hard: \"When an AI engine returned no data, I could estimate a value to keep charts complete, or show “N/A”. Estimating looks better in a demo. I chose “N/A” and made “no mock data” a visible product promise, because an AI-visibility tool is only worth paying for if users trust every number. That decision became the brand: evidence-first.\",\n    didntTitle: \"What didn't work\",\n    didnt: \"My first go-to-market story led with recurring SEO and content services. An installation-focused contractor told me plainly that it didn't fit how their business worked. That pushed me to lead with the website chatbot — something every trade business understands on sight — and it grew into a standalone product.\",\n    solution: [[\"Dashboard\", \"visibility score, share of voice and citation coverage lead; competitors sit beside them for context.\"], [\"AI response viewer\", \"one prompt, every engine, side by side, with competitors highlighted. Proof, not a claim.\"], [\"What's Next\", \"insight becomes a plan: moves tagged by impact and effort, plus a task tracker.\"], [\"Business Analysis onboarding\", \"the product analyses your site and finds competitors, so day one is already useful.\"], [\"Website chatbot inbox\", \"the module that became a standalone product.\"]],\n    outcome: [\"Launched a live, paid SaaS with tiered plans.\", \"The chatbot module proved strong enough to sell on its own, and led to a talking voice assistant.\"],\n    differently: \"I'd run five structured usability sessions before launch instead of relying on sales calls.\",\n    opinion: \"In AI products, trust is the interface. If users can't see where a number came from, the design has failed — however good it looks.\",\n    link: { label: \"Visit hiaimate.com\", url: \"https://hiaimate.com\" } },\n  { id: \"zenfire\", title: \"ZenFire website\", domain: \"Field-service SaaS\", role: \"Sole UI/UX Designer\",\n    card: \"+45% CTR, +20% conversion.\", cardSub: \"ZenFire website redesign · Sole UI/UX Designer\",\n    metric: \"+45% CTR · +20% conversion\", imgHint: \"ZenFire — homepage\",\n    resultLine: \"My redesign of the ZenFire website lifted click-through rate by 45% and monthly traffic conversion by 20%.\",\n    metrics: [{ v: \"+45%\", l: \"Click-through rate\" }, { v: \"+20%\", l: \"Monthly traffic conversion\" }, { v: \"12\", l: \"FAQ answers to sales' top objections\" }],\n    glance: [[\"Role\", \"Sole UI/UX Designer, end to end\"], [\"Team\", \"Sole designer; shipped with the web team\"], [\"Timeline\", \"2025–2026\"], [\"Platform\", \"WordPress marketing site (zentrades.pro/zenfire)\"], [\"Outcome\", \"+45% CTR, +20% monthly traffic conversion\"]],\n    team: \"Sole designer; shipped with the web team.\",\n    problem: \"ZenFire is ZenTrades' fire-inspection software. Its website was long, visually inconsistent and dated, and full of content unrelated to fire inspection. Fire-protection owners couldn't quickly tell what the product did. The business problem: marketing was paying to bring visitors to a page that didn't convert them.\",\n    success: \"More visitors clicking through to a demo, measured in Google Analytics, Search Console and Microsoft Clarity.\",\n    did: [\"Audited every section of the old site and decided what stayed, what merged and what went.\", \"Rewrote the page structure: promise → proof → benefits → features → savings → testimonials → integrations → FAQ.\", \"Designed every page and component, and worked with the build team through launch.\", \"Set up the measurement and read the before/after data.\"],\n    constraints: [\"WordPress. Every component had to be buildable within the platform's limits, so I designed with its capabilities in mind rather than fighting them.\", \"A niche, sceptical audience that responds to compliance and NFPA language, not generic software claims.\"],\n    hardTitle: \"Remove content people wanted to keep\",\n    hard: \"The riskiest call was length. A long page feels thorough; a short one risks leaving questions unanswered. I chose a much shorter page built around one question — does this help a fire-protection owner book a demo? — cut everything that didn't, and moved remaining detail into the FAQ. The data proved the call.\",\n    didntTitle: \"What didn't work\",\n    didnt: \"WordPress put real limits on the build, and parts of my first design had to be simplified to ship. The lesson I took: check buildability with the web team while designing, not after handoff.\",\n    solution: [[\"Hero\", \"one promise and one proof point, instead of a wall of claims.\"], [\"Savings calculator\", \"visitors enter their number of inspectors and see the value themselves.\"], [\"Features grid\", \"written in the audience's language: NFPA forms, recurring inspections, deficiency detection.\"], [\"FAQ\", \"12 questions answering the objections sales heard most.\"], [\"Before / after\", \"the old page length next to the new one.\"]],\n    outcome: [\"+45% click-through rate\", \"+20% monthly traffic conversion\", \"A consistent system marketing can extend without breaking the design\"],\n    differently: \"I'd A/B test the hero before full launch, to know which change drove the lift.\",\n    opinion: \"Most marketing sites don't have a design problem; they have an editing problem.\",\n    link: { label: \"Visit ZenFire\", url: \"https://zentrades.pro/zenfire\" } },\n  { id: \"goal\", title: \"Goal Dashboard\", domain: \"Fintech\", role: \"Product Designer\",\n    card: \"+45% of users set up a goal in under 7 minutes; 4.6★ beta rating.\", cardSub: \"Centricity WealthTech · Product Designer\",\n    metric: \"87.5% unaided goal creation · 4.6★\", imgHint: \"Goal Planning dashboard\",\n    resultLine: \"RMs were planning clients' life goals in spreadsheets. I designed a guided goal-planning dashboard for first-time and experienced investors alike — 87.5% created a goal unaided in testing, and the beta scored 4.6★.\",\n    metrics: [{ v: \"87.5%\", l: \"Goal creation success rate in usability testing\" }, { v: \"2m 15s\", l: \"Average time to complete goal setup\" }, { v: \"4.6★\", l: \"Average rating in early beta (in-app survey)\" }],\n    glance: [[\"Role\", \"Product Designer, end to end: research, UI, testing\"], [\"Team\", \"Me, with Centricity's product and engineering team\"], [\"Year\", \"2024\"], [\"Platform\", \"Web, laptop and tablet\"], [\"Users\", \"RMs, portfolio coaches and their clients\"]],\n    quick: [[\"Flow\", \"A lesson, not a form\", \"Goal setup paced like a language app: one question at a time, with a running summary beside it.\"], [\"Depth\", \"Simple by default, deep on demand\", \"A simplified view for beginners, with a portfolio breakdown one step away for experienced investors.\"], [\"Trust\", \"No hidden maths\", \"Every projection shows its assumptions, and users can change them and see the plan update.\"]],\n    team: \"Product set priorities and release scope. Engineering built the dashboard and the beta.\",\n    problem: \"Relationship managers (RMs) and portfolio coaches guide clients through big decisions: retirement, a child's education, a first home. They had no goal-planning tool — calculations and records lived in Excel, which made meetings slow and errors easy. First-time investors found it hard to connect an investment strategy to a real goal; the apps they knew either buried them in jargon or oversimplified without personalising anything. The business problem: clients who don't understand a plan don't commit to it, and every plan built in a spreadsheet depends on one RM's time.\",\n    painsTitle: \"The gap no competitor had filled\",\n    pains: [[\"Groww\", \"Strong: goal-based mutual funds, clean UI. Weak: limited visualisation and control over goals.\"], [\"ET Money\", \"Strong: SIP planner with goal suggestions. Weak: cluttered layout, little emotional design.\"], [\"Scripbox\", \"Strong: good onboarding for goal-based investing. Weak: locked features, less control over funds.\"], [\"Zerodha Coin\", \"Strong: direct mutual funds, low cost. Weak: no goal-based investing features.\"], [\"The gap → the brief\", \"Combine emotional design, guidance and control in one product.\"]],\n    personas: [[\"N\", \"Neha, 29\", \"First-time investor · Marketing Executive, Mumbai\", \"Help me invest without feeling stupid.\", \"Saving for a house in five years, overwhelmed by jargon and scared of losing money.\", \"A guided, step-by-step flow, simple visuals and recommendations matched to her risk comfort.\"], [\"R\", \"Rajat, 38\", \"Experienced investor · Software Engineer, Bengaluru\", \"I want my goals to align with my portfolio strategy.\", \"Invests across several platforms and finds goal tools too basic.\", \"Portfolio breakdowns, scenarios with variable inputs, and full transparency on how projections are calculated.\"]],\n    personaTitle: \"Two investors at opposite ends\",\n    personaNote: \"Designing for both at once was the core challenge. Anything simple enough for Neha risked feeling shallow to Rajat.\",\n    drivers: [[\"Simplicity with depth\", \"A clean interface for beginners, with layered insight for advanced users.\"], [\"Trust through transparency\", \"Clear risk-return relationships and projections. No hidden maths.\"], [\"Guided personalisation\", \"Goal suggestions adapted to time horizon, corpus and risk appetite.\"], [\"Visual motivation\", \"Progress rings, milestones and timelines that keep people engaged.\"], [\"Financial literacy, built in\", \"Terms explained in place, and returns shown with how they are calculated.\"]],\n    driversTitle: \"Five drivers, and how I measured them\", driversIntro: \"Each driver was measured by task success (can a user create a goal without help?), time on task, and confidence in the plan.\",\n    success: \"Can a user create a goal without help, how long does setup take, and how sure do they feel about their plan? Task success, time on task and confidence — agreed before designing.\",\n    did: [\"Ran discovery and the competitive analysis.\", \"Built personas and turned research into five design drivers.\", \"Designed the information architecture, wireframes and UI.\", \"Planned and ran usability testing, then iterated on the findings.\", \"Defined the success metrics and reported the results.\"],\n    constraints: [\"Two audiences on one screen: an expert RM and a nervous first-time investor.\", \"Financial accuracy couldn't be simplified away — only explained.\", \"The tool had to work live, inside a client meeting.\"],\n    hardTitle: \"A guided flow instead of one fast form\",\n    hard: \"A single form would have been faster for RMs and experienced investors. A step-by-step flow would be slower but far less intimidating for a first-time investor. I chose the guided flow and paced it like a lesson: a short risk profile, then goal selection, then details, with a summary filling in on the right as users answer. Risk questions use everyday situations instead of financial terms — one asks what you'd do with savings for a long-awaited holiday if you lost your job a week before. Testing showed the guided flow didn't cost speed: average goal setup took just over two minutes.\",\n    decisions: [[\"05.1\", \"Decision 02 · Depth\", \"Simple by default, deep on demand\", \"The dashboard opens on what both personas need first: risk profile, emergency fund, insurance, goals and how money is split across equity and debt. Below, a “What If” panel lets users change inflation, expected returns and amounts, and see lump-sum and SIP options update. Experienced investors get a portfolio view inside each goal; beginners never have to open it.\"]],\n    didntTitle: \"What testing changed\",\n    didnt: \"I ran usability tests with beginner and intermediate investors on three tasks: create a retirement goal, adjust investment inputs, and understand the forecast. The second change taught me the most — users ignore learning they have to stop and open, but read it when it sits beside the number they're looking at.\",\n    tA: \"Found\", tB: \"Changed\", tDeco: \"none\",\n    tradeoffs: [[\"Beginners were overwhelmed by projections\", \"Added a simplified view toggle with tooltips.\"], [\"Users skipped the educational pop-ups\", \"Replaced them with tooltips in context and progressive disclosure.\"], [\"Advanced users wanted an asset breakdown\", \"Added a Portfolio View inside each goal's detail page.\"], [\"The forecast graph confused some users\", \"Added labelled milestones and a clearer legend.\"]],\n    solution: [[\"Risk profile\", \"a step rail on the left, one plain-language question at a time, and the summary building on the right.\"], [\"Goal selection and details\", \"life goals as illustrated cards, several at once, then an amount and date for each.\"], [\"Goal Planning dashboard\", \"readiness first (risk, emergency fund, insurance), then goals, then allocation and the “What If” assumptions.\"], [\"On tablet\", \"designed for RMs to walk a client through a plan in person.\"]],\n    system: { body: \"Calm, warm and readable. Warm sand and rose against charcoal keep a money product from feeling clinical, and Montserrat in three weights keeps numbers clear.\", swatches: [\"#B69377\", \"#B64F7E\", \"#494949\", \"#ECECEC\"], validation: \"Beta feedback: “This feels like Duolingo for investing. I actually get it.”\" },\n    outcome: [\"87.5% goal creation success rate in usability testing\", \"2 min 15 s average time to complete goal setup\", \"45% completed their first goal setup within 7 minutes of signing up\", \"30% increased their SIP contribution using the “What If” tool\", \"4.6★ average rating in early beta (in-app survey)\", \"RMs moved goal planning out of Excel and into a tool they could use live in client meetings\"],\n    differently: \"Clients wanted to revisit their plan after the meeting, on their phones. Next time I would design the mobile version alongside desktop from day one.\",\n    opinion: \"Financial products don't lose people because the maths is hard. They lose them because nobody showed the maths kindly.\",\n    note: \"Client names and figures in these screens are placeholder data, used for confidentiality.\",\n    link: null },\n  { id: \"system\", title: \"ZenTrades Design System\", domain: \"Field-service SaaS\", role: \"Design system owner\",\n    card: \"One system, 15+ dashboards, web to mobile.\", cardSub: \"ZenTrades.AI · Design system owner\",\n    metric: \"15+ dashboards · +46% task completion\", imgHint: \"ZenTrades — component sheet\",\n    resultLine: \"I built the design system behind 15+ ZenTrades product dashboards — web, tablet and mobile — and used it to redesign a mission-critical fire-inspection dashboard that improved task completion by 46%.\",\n    metrics: [{ v: \"15+\", l: \"Dashboards on one system\" }, { v: \"25+\", l: \"Components · 40+ icon categories\" }, { v: \"+46%\", l: \"Task completion, fire-inspection dashboard\" }],\n    glance: [[\"Role\", \"Senior Product Designer, design system owner\"], [\"Team\", \"Me, with ZenTrades' product and engineering teams\"], [\"Timeline\", \"Oct 2025 – present; design system shipped Nov 2025\"], [\"Platform\", \"Web, tablet, iOS\"], [\"Outcome\", \"25+ components · 40+ icon categories · 15+ dashboards · +46% task completion\"]],\n    team: \"ZenTrades' product and engineering teams.\",\n    problem: \"ZenTrades gives trade businesses — HVAC, plumbing, electrical, fire protection — one platform for estimates, invoices, scheduling, dispatch, inventory and more. As modules multiplied, keeping every screen consistent got harder, and each new module meant solving the same UI problems again. The system's job was to make consistency the default.\",\n    success: \"New modules built from existing components instead of from scratch, and one consistent experience across every module and device.\",\n    did: [\"Audited the product for repeated patterns and inconsistencies.\", \"Defined the foundations: type, colour, spacing and shadows.\", \"Designed 25+ components with every state and size, plus an icon library in 40+ categories.\", \"Designed 15+ dashboards on the system, including role-based Owner and Service Manager views.\", \"Extended the system to tablet and mobile field apps, including NFPA inspection forms.\"],\n    constraints: [\"The product kept shipping while I built the system — no pause to rebuild everything at once.\", \"Users range from office owners at a desk to technicians on a roof with a phone.\", \"Engineers needed components specified clearly enough to build without constant back-and-forth.\"],\n    hardTitle: \"Systemise first, or redesign first\",\n    hard: \"The product couldn't pause while I built a system. So I started with foundations and the most-used components, then applied them module by module as screens were redesigned — every later dashboard came faster and matched automatically.\",\n    didntTitle: \"What I learned\",\n    didnt: \"Building while the product kept shipping meant design and code could drift. Components had to be specified clearly enough for engineers to build without constant back-and-forth.\",\n    solution: [[\"Foundations sheet\", \"colour and type decisions that everything else inherits.\"], [\"Component sheet\", \"buttons, chips, alerts, checkboxes and tabs with all their states.\"], [\"Owner vs Service Manager dashboards\", \"same components, different priorities for different roles.\"], [\"Live tracking and scheduling\", \"the system handling dense, real-time operations data.\"], [\"Mobile NFPA inspection form\", \"the same system on a technician's phone.\"]],\n    outcome: [\"15+ dashboards and three device types in one consistent visual language\", \"+46% task completion on the redesigned fire-inspection dashboard\", \"The system extended into ZenTrades marketing design, shipped Nov 2025\"],\n    differently: \"I'd set up design tokens shared with code from day one, so design and engineering never drift.\",\n    opinion: \"A design system is a product whose users are your own team — it only works if they choose to use it.\",\n    link: null }\n];\n\nconst SUP = [\n  { id: \"onedigital\", caseId: \"onedigital\", title: \"OneDigital\", domain: \"Fintech\", role: \"Senior UX Designer\", sub: \"The platform behind a 20,000-advisor wealth network\",\n    card: \"Live on iOS (4.2★), built for a 20,000+ advisor network\", metric: \"Live on iOS · 4.2★\",\n    meta: [[\"Role\", \"Senior UX Designer, led UX — joined in the company's first months\"], [\"Platform\", \"Web + iOS\"], [\"Users\", \"Advisors and portfolio managers, and the families they serve\"]],\n    context: \"Centricity, founded in early 2022, calls itself India's largest assisted wealthtech platform: ₹18,000+ Cr assets under management, 20,000+ partner advisors, 1,00,000+ investors, 66+ cities and 75+ branches. OneDigital is its core platform for independent financial advisors, mutual-fund distributors and other wealth intermediaries — and it is live on the App Store (4.2★).\",\n    body: \"Advisors were managing many clients across fragmented tools, and clients struggled to understand their own portfolios. I led research through 50 interviews with 30 clients and 20 relationship managers, built empathy maps and four personas, and designed the platform's core journeys: sign-up and OTP authentication, a guided risk-profile questionnaire, asset allocation with an edit-allocation flow, IPS allocation, a family-portfolio dashboard for clients, and a portfolio-manager dashboard with live market widgets.\",\n    decision: \"Role-specific views on one platform — clients see “how am I doing?”, advisors and PMs get a working tool — instead of one dense screen for everyone.\",\n    result: \"Shipped and in production at national scale, live on iOS with a 4.2★ rating.\",\n    recognition: \"The platform I designed for has since won 15+ industry awards, including Best Investment Management Platform.\",\n    images: [\"Family portfolio dashboard\", \"Risk-profile questionnaire\", \"Asset and IPS allocation\", \"PM dashboard\"],\n    note: \"Client names and figures replaced with placeholder data for confidentiality.\",\n    link: { label: \"View OneDigital on the App Store\", url: \"https://apps.apple.com/in/app/one-digital/id6468991931\" } },\n  { id: \"clara\", title: \"Clara AI\", domain: \"AI SaaS\", role: \"UI/UX Designer\", sub: \"Selling AI agents to trade contractors\",\n    card: \"Multi-page AI product site, 5 trades\", metric: \"5 trades · 9 integrations\",\n    meta: [[\"Role\", \"UI/UX Designer\"], [\"Platform\", \"Marketing website (justclara.ai)\"]],\n    context: \"\",\n    body: \"Clara offers three AI agents — call answering, a field co-pilot and payment collection — to sceptical HVAC and fire-protection owners. I structured the site around the contractor's day (front office, field, back office) and designed one reusable solution-page template so new agents, industries and integrations can launch fast.\",\n    decision: \"Lead with named customer results, filterable by trade, instead of AI claims.\",\n    result: \"A live, multi-page site covering 5 trades and 9 integrations.\",\n    recognition: \"\", images: [\"Homepage\", \"“How it works” flow\", \"A solution page\"], note: \"\",\n    link: { label: \"Visit justclara.ai\", url: \"https://justclara.ai\" } },\n  { id: \"invictus\", caseId: \"invictus\", title: \"Invictus\", domain: \"Fintech\", role: \"UI Designer\", sub: \"One clear view of a family's entire wealth\",\n    card: \"One trusted view of a UHNI family's entire wealth\", metric: \"One number a family can trust\",\n    meta: [[\"Role\", \"UI Designer\"], [\"Platform\", \"Tablet and desktop, light and dark themes\"], [\"Users\", \"UHNI families and their advisors\"]],\n    context: \"Invictus Private Wealth is Centricity's family-office arm for ultra-high-net-worth clients: promoter and business families, founders after liquidity events, senior executives, corporate treasuries and single-family offices. Their wealth spans public markets, private investments, real estate and operating businesses. Invictus's own philosophy is that most wealth isn't lost in markets but through fragmentation and complexity — the dashboard is where that fragmentation has to disappear.\",\n    body: \"Research found five problems in the old dashboard: information overload, weak visuals, confusing navigation, no customisation and a poor mobile experience. I rebuilt the hierarchy so the answers a family wants first — Total AUM, XIRR and benchmark XIRR — lead the page, with net worth, quick-access shortcuts and a portfolio-vs-benchmark chart below to show whether returns are actually good.\",\n    decision: \"Consolidation over completeness. For families whose wealth sits in many places, the first screen shows one number they can trust, and detail waits one tap away.\",\n    result: \"A dashboard addressing all five research pain points, designed as one light-and-dark system for a premium audience.\",\n    recognition: \"\", images: [\"iPad + laptop lifestyle mockup\", \"Light and dark dashboards side by side\"], note: \"\", link: null },\n  { id: \"aif\", caseId: \"aif\", title: \"AIF Calculator\", domain: \"Fintech\", role: \"UX Researcher & UI Designer\", sub: \"Complex fund maths on one screen\",\n    card: \"Complex fund maths on one mobile screen\", metric: \"Individual + Compare modes\",\n    meta: [[\"Role\", \"UX Researcher & UI Designer\"], [\"Platform\", \"Mobile, light and dark\"]],\n    context: \"\",\n    body: \"Research showed Fixed Deposit and Alternative Investment Fund users needed different designs: one wants a quick answer, the other is comparing high-stakes funds. I designed the AIF calculator with an Individual mode and a Compare mode, and progressive inputs that hide advanced fee settings until needed.\",\n    decision: \"Not forcing two very different calculators into one design.\",\n    result: \"A calculator that makes a complex investment understandable on a phone.\",\n    recognition: \"\", images: [\"Phone hero\", \"Individual mode\", \"Compare mode\"], note: \"\", link: null }\n];\n\nconst OD = { id: \"onedigital\", title: \"OneDigital\", domain: \"Fintech\", role: \"Senior UX Designer, UX lead\",\n  card: \"Live on iOS (4.2★), built for a 20,000+ advisor network\", imgHint: \"OneDigital — login and portfolio dashboard\",\n  resultLine: \"I led UX for OneDigital, Centricity's core platform for advisors and the families they manage — from a blank page to launch. It's live on iOS at 4.2★.\",\n  metrics: [{ v: \"4.2★\", l: \"App Store rating for OneDigital on iOS\" }, { v: \"20,000+\", l: \"Partner advisors in the network the platform serves\" }, { v: \"50\", l: \"User interviews — 30 clients, 20 RMs\" }],\n  glance: [[\"Role\", \"Senior UX Designer, UX lead for the product\"], [\"Scope\", \"End to end: research, strategy, IA, UI, design system, handoff\"], [\"Team\", \"Me, with Centricity's product and engineering team; mentored junior designers\"], [\"Timeline\", \"6-month roadmap, discovery to launch\"], [\"Platform\", \"Web app + iOS · Live, 4.2★\"]],\n  quick: [[\"Structure\", \"Two dashboards, one platform\", \"Advisors and clients ask different questions, so each got a dashboard built for theirs, on shared components.\"], [\"Onboarding\", \"Setup before the dashboard\", \"A short, guided path from sign-up to allocation, so a client's first dashboard is already about them.\"], [\"Discovery\", \"A risk map, not a product list\", \"Products laid out from low to high risk, so people choose by fit instead of by category.\"]],\n  team: \"Product set business priorities and release scope. Engineering built the web app and iOS app from my handoff files.\",\n  problem: \"OneDigital serves relationship managers (RMs) who look after dozens of families, and the clients who invest through them. Before OneDigital, both relied on a patchwork of tools. RMs switched between tabs and offline notes to follow up on clients. Clients couldn't tell whether their goals were on track, found risk questionnaires long and confusing, and gave up uploading their mutual-fund statements. The business problem: clients who don't understand their portfolio don't act on it, and an RM who spends meetings explaining the interface has less time to advise.\",\n  success: \"Agreed before the first wireframe: users complete core journeys unaided, clients finish the risk profile and statement upload, RMs and clients rate the product higher, and RMs raise fewer support tickets.\",\n  did: [\"Planned the six-phase design roadmap and ran it from discovery to launch.\", \"Led the research: 50 interviews, synthesis, empathy maps and personas.\", \"Set the five design drivers every screen was reviewed against.\", \"Designed the information architecture and every core journey.\", \"Built the component library and design tokens for handoff.\", \"Mentored junior designers working on the product.\"],\n  research: { title: \"50 conversations over three weeks\", intro: \"I ran remote interviews with 30 clients and 20 RMs, observed how they worked with their current tools, and followed up with surveys. RMs wanted faster client onboarding, clearer portfolio views and fewer support tickets. Clients wanted easy goal tracking, suggestions that fit them, and a simpler dashboard.\",\n    quotes: [[\"I check client activities, follow up with alerts, and suggest rebalancing. But the data isn't always in one place.\", \"Relationship manager\"], [\"The risk profiling tool is too long, so many clients abandon it.\", \"Relationship manager\"], [\"The dashboard feels very cluttered. I don't know where to start.\", \"Client\"], [\"The performance graph is too technical. I just want a simple green or red indicator.\", \"Client\"]],\n    bars: [[\"Complex dashboard\", 35], [\"Difficult product discovery\", 25], [\"Poor mobile experience\", 20], [\"Slow statement (CAS) upload\", 10], [\"Lack of personalisation\", 10]],\n    note: \"The mutual-fund statement (CAS) upload showed a high drop-off in the data I analysed. One step could block onboarding entirely, so designing it well became a top priority.\" },\n  personas: [[\"S\", \"Suresh, the power RM\", \"15 years' experience · manages 20 client families\", \"Too much toggling between tabs.\", \"Checks the RM dashboard daily and keeps follow-ups in offline notes.\", \"Smart alerts on client actions and one-click product recommendations.\"], [\"R\", \"Rajeev, the busy client\", \"Senior manager · investing for family goals\", \"The dashboard overwhelms me.\", \"Logs in monthly and relies on his RM to act.\", \"A clear view of his goals and recommendations, without jargon.\"]],\n  personaNote: \"Two secondary personas sharpened the edges: a first-time investor who used only the mobile app, and a self-directed investor who wanted real estate and equity in one view.\",\n  drivers: [[\"Clarity over complexity\", \"Visual hierarchy and sensible defaults to cut cognitive load.\"], [\"Actionable personalisation\", \"Suggestions based on risk profile, past behaviour and life stage.\"], [\"Seamless mobility\", \"The same experience on every device.\"], [\"Trust through transparency\", \"Show portfolio risk and past performance clearly enough to believe.\"], [\"Efficiency for RMs\", \"One-click insights, client segmentation and pre-filled portfolio suggestions.\"]],\n  constraints: [\"Risk profiling can't be skipped. It's a required step before advice is given, so the questionnaire could be shortened and paced, never removed.\", \"Dense, high-stakes data. Portfolios span equity, debt, commodities, AIFs and real estate; simplifying couldn't mean hiding numbers advisors rely on.\", \"Confidential client data. Every screen had to be designed and tested with placeholder figures.\"],\n  hardTitle: \"Separate views for RMs and clients, on one platform\",\n  hard: \"The cheapest option was one dashboard with permissions. The research said the two groups ask different questions: a client asks “how am I doing?”, an RM asks “who needs me today?” I made the case for two dashboards on shared components. It cost more design work up front, but each screen could lead with one answer, and shared components kept the two consistent.\",\n  decisions: [[\"05.1\", \"Decision 02 · Onboarding\", \"Setup before the dashboard\", \"Clients were abandoning the long questionnaire and the statement upload. Because risk profiling had to stay, I made it feel shorter: one question per step, a progress rail, and a result shown on a scale of five profiles so it reads as a position, not a verdict. Allocation follows immediately, so setup ends with something useful.\"], [\"05.2\", \"Decision 03 · Discovery\", \"A risk map instead of a product list\", \"A quarter of interviewees struggled to find the right product. A list sorted by category gave no sense of which options suited their risk appetite. I laid the marketplace out as a map from low to high risk, each tile showing expected return. Opening a tile shows what's inside and one action: “Start investing”.\"]],\n  didntTitle: \"Trade-offs\",\n  didnt: \"Every decision cost something. These are the three I'd defend in any review.\",\n  tradeoffs: [[\"A single, cheaper dashboard\", \"Advisors and clients each get a screen that answers their own question.\"], [\"A one-page risk form that looked faster\", \"Short, paced steps — clients were abandoning the long version.\"], [\"The familiar category list in the marketplace\", \"A risk map, so choices are made by suitability first.\"]],\n  solution: [[\"App architecture\", \"Dashboard, Portfolio, Product listing and Cart, each capped at three sub-views to keep navigation shallow.\"], [\"RM dashboard\", \"AUM and clients first, follow-ups on a calendar, live markets alongside, so an RM's day starts on one screen.\"], [\"Client dashboard\", \"family members as tabs, performance against benchmark, and net worth by asset class — real estate alongside equity.\"], [\"Risk questionnaire\", \"short steps with a progress rail, so people always know how much is left.\"], [\"Risk result\", \"all five profiles side by side, with the client's highlighted.\"], [\"Asset allocation\", \"the recommended split for the investment amount, with an edit flow and IPS allocation for advisors.\"], [\"Product marketplace\", \"products placed on a risk scale, filterable by equity, debt, commodity and AIFs.\"], [\"Foundations\", \"graphite, ivory and two warm golds, with Montserrat in three weights for dense financial data.\"]],\n  system: { body: \"I handed off a dev-ready component library in Figma with design tokens and documentation, so engineers built from one source and new screens matched by default. The visual language stayed deliberately quiet: graphite, ivory and two warm golds, chosen for a private-wealth audience.\", swatches: [\"#F2F2F2\", \"#EED192\", \"#E2AB66\", \"#141414\"], validation: \"Validation was built into the roadmap: usability testing, an A/B test of the model-portfolio layout and dashboard heatmaps before handoff, then a soft launch to 10% of users tracking task success and NPS.\" },\n  outcome: [\"4.2★ App Store rating for OneDigital on iOS\", \"Serves a network of 20,000+ partner advisors\", \"+30% task completion across the Centricity products I led UX for\", \"+22% user satisfaction across the same products\", \"The platform has since won 15 industry awards, including Best Investment Management Platform\"],\n  differently: \"A fifth of interviewees named mobile as a problem, and one persona used only her phone. Next time I would design mobile first instead of adapting desktop screens to it.\",\n  opinion: \"“The user” rarely exists. On a platform with advisors and clients, most of the real design work is deciding whose question each screen answers first.\",\n  note: \"Client names and figures in these screens are placeholder data, used for confidentiality.\",\n  link: { label: \"View on the App Store\", url: \"https://apps.apple.com/in/app/one-digital/id6468991931\" } };\nconst INV = { id: \"invictus\", supIndex: 2, title: \"Invictus\", domain: \"Fintech\", role: \"Senior UX Designer\",\n  card: \"One trusted view of a UHNI family's entire wealth\", imgHint: \"Invictus — redesigned dashboard, light and dark\",\n  resultLine: \"I redesigned Invictus's client dashboard around the three numbers a family asks about first, cut navigation down to one Quick Access panel, and delivered it as one system in light and dark.\",\n  metrics: [{ v: \"5/5\", l: \"Research pain points addressed in the redesign\" }, { v: \"1 click\", l: \"To each of the eight most-used reports\" }, { v: \"2 themes\", l: \"Light and dark, designed as one system\" }],\n  glance: [[\"Role\", \"Senior UX Designer, owned the dashboard redesign\"], [\"Scope\", \"Audit, information hierarchy, UI, visual system, handoff\"], [\"Team\", \"Me, with Centricity's product and engineering team\"], [\"Year\", \"2023\"], [\"Platform\", \"Desktop and tablet · Light and dark themes\"]],\n  quick: [[\"Hierarchy\", \"Answers before detail\", \"Market value, returns against benchmark and net worth lead the screen. Everything else sits one step deeper.\"], [\"Navigation\", \"Reports in one panel\", \"Eight reports families and advisors used most, gathered into a single Quick Access panel.\"], [\"System\", \"Two themes, one design\", \"Light and dark built together from one palette, so figures read clearly in both.\"]],\n  context: { title: \"Who Invictus serves\", paras: [\"Invictus is the family-office side of Centricity. Its clients are promoter and business families, founders after a liquidity event and established single family offices. Their wealth sits across equity, debt, real estate investment trusts and holdings managed by several distributors at once.\", \"The product's promise is to democratise investment intelligence: give a family one trustworthy picture of everything they own, so they can make decisions with confidence. The dashboard is where that promise is kept or broken.\"] },\n  problem: \"The data was all there. The answers weren't. The existing dashboard showed a lot, with little sense of what mattered most. Every family member had their own row of tiles, figures competed for attention, and finding a specific report meant digging through menus. The business problem: for a family office, a dashboard nobody can read means more calls to advisors and less trust in the numbers. For a premium product, clarity is part of what clients pay for.\",\n  painsTitle: \"Five pain points in the old dashboard\",\n  pains: [[\"Information overload\", \"Too much data on one screen, so users couldn't focus.\"], [\"Weak colour and visuals\", \"Important figures like investment, balance and charts didn't stand out.\"], [\"Non-intuitive navigation\", \"Users struggled to find specific reports or features.\"], [\"No customisation\", \"Users wanted to see what mattered most to them.\"], [\"Limited mobile experience\", \"The dashboard was cluttered and hard to use on smaller screens.\"]],\n  success: \"The mission: improve usability, clarity and decision-making support — turned into four questions every screen had to pass.\",\n  driversLabel: \"Success criteria\", driversTitle: \"Four questions every screen had to pass\", driversIntro: \"Each screen was reviewed against these before it moved to handoff.\",\n  drivers: [[\"Clarity\", \"Can a family see how they are doing in a few seconds?\"], [\"Findability\", \"Can users reach any report in one click?\"], [\"Trust\", \"Is it obvious what every number means and how current it is?\"], [\"Comfort\", \"Does it read well for long sessions, day or night?\"]],\n  did: [\"Audited the existing dashboard and defined the five pain points.\", \"Set the mission and success criteria for the redesign.\", \"Rebuilt the information hierarchy and navigation.\", \"Designed the new visual system and both themes.\", \"Delivered production-ready screens for desktop and tablet.\"],\n  team: \"Product set priorities and release scope. Engineering built the redesigned dashboard from my designs.\",\n  constraints: [\"Wealth spread across equity, debt, REITs and holdings managed by several distributors at once — all of it had to add up on one screen.\", \"A premium, high-trust audience: every figure needed a clear meaning and a visible “As on” date.\", \"Long review sessions at a desk and on a tablet at night, so both themes had to stay readable.\"],\n  hardTitle: \"Lead with the family total, not every member\",\n  hard: \"The old layout gave each family member equal space at the top, which looked complete but answered no question. I made the family total the default view and moved members into tabs above it. The top of the screen now answers three questions: what is it worth (market and invested value), how is it doing (XIRR against benchmark XIRR), and what do we own in total (net worth). A dated “As on” stamp shows exactly how current the figures are.\",\n  decisions: [[\"05.1\", \"Decision 02 · Navigation\", \"Every report one click away\", \"Navigation was the third pain point: people couldn't find reports. Instead of a deeper menu, I gathered the reports used most into one Quick Access panel beside net worth: Holding, Valuation, Transaction and Capital Gain reports, Held Away assets, Model Portfolio and IPS Allocation. Performance sits directly below, plotted against the Nifty 50 with hover values, so a family sees whether their returns are actually good rather than just positive.\"], [\"05.2\", \"Decision 03 · System\", \"Two themes designed as one system\", \"Families review their wealth at a desk in the morning and on a tablet at night. I designed light and dark together from one palette, tuning the indigo, magenta and crimson so charts and key figures keep their contrast in both, rather than inverting colours at the end.\"]],\n  didntTitle: \"Trade-offs\",\n  didnt: \"Each gain came from giving something up.\",\n  tradeoffs: [[\"Showing every family member at once\", \"A family total first, with members one tap away in tabs.\"], [\"A restrained monochrome look\", \"A richer palette, because users said key figures didn't stand out.\"], [\"A deeper reporting menu\", \"Eight shortcuts on the home screen, chosen by how often reports were used.\"]],\n  solution: [[\"Before\", \"a tile for every family member, a monochrome performance chart and distributor exposure all competing at the same level.\"], [\"After\", \"family members as tabs, four headline figures, net worth and Quick Access above the fold.\"], [\"Dark theme\", \"the same hierarchy and components, with gradients and chart fills adjusted for a dark background.\"], [\"Before and after\", \"the same family portfolio, now led by its answers.\"], [\"Light and dark on tablet\", \"built for the devices family offices actually review their wealth on.\"]],\n  system: { body: \"Indigo and magenta carry the charts, warm golds and crimson mark gains and emphasis, and a deep navy anchors the dark theme. Montserrat in three weights keeps dense financial figures readable.\", swatches: [\"#3D00D7\", \"#F0269D\", \"#C3495B\", \"#AF031C\", \"#EED192\", \"#E2AB66\", \"#09052E\", \"#F2F2F2\"], validation: \"Premium, with figures that stand out — in both themes.\" },\n  outcome: [\"5 of 5 research pain points addressed in the redesign\", \"1 click to each of the eight most-used reports\", \"2 themes designed as one system\", \"+30% task completion across the Centricity products I led UX for\", \"The platform has since won 15 industry awards, including Best Wealth Insights & Engagement Platform in India\"],\n  differently: \"Limited mobile experience was one of the five pain points, but this redesign focused on desktop and tablet. Next time I would design the phone layout alongside them, since that is where families check in between meetings.\",\n  opinion: \"Democratising intelligence isn't about showing more data. It is about showing the three numbers that matter first, and letting people go deeper when they choose.\",\n  note: \"Client names and figures in these screens are placeholder data, used for confidentiality.\",\n  link: null };\nconst AIF = { id: \"aif\", supIndex: 3, title: \"AIF Calculator\", domain: \"Fintech\", role: \"UX Researcher & UI Designer\",\n  card: \"Complex fund maths on one mobile screen\", imgHint: \"AIF Calculator — gross to net, fee by fee\",\n  resultLine: \"AIF fees — hurdle rates, catch-up clauses, performance fees — confuse even experienced investors. I redesigned Centricity's two calculators for mobile, and the AIF calculator now walks from gross return to net return, one fee at a time.\",\n  metrics: [{ v: \"2\", l: \"Calculators, each designed for its own investor\" }, { v: \"10\", l: \"Competitor tools benchmarked to find the gap\" }, { v: \"35\", l: \"Icons designed for the wider platform\" }],\n  glance: [[\"Role\", \"UX Researcher and UI Designer, end to end\"], [\"Scope\", \"UX audit, competitive analysis, personas, mobile UI, icon set\"], [\"Team\", \"Me, with Centricity's product and engineering team\"], [\"Platform\", \"Mobile app, dark and light\"], [\"Products\", \"AIF calculator and Fixed Deposit calculator\"]],\n  quick: [[\"Strategy\", \"Two calculators, two designs\", \"A fast, reassuring FD calculator for savers, and a transparent, comparative AIF calculator for high-net-worth investors.\"], [\"Transparency\", \"Gross to net, line by line\", \"Each fee is deducted on its own row, so investors see what goes to the fund and what comes to them.\"], [\"Opportunity\", \"Compare and stress test\", \"Side-by-side fund comparison and a stress test — the scenario tools competitors rarely got right.\"]],\n  problem: \"Centricity offered two calculators. The Fixed Deposit (FD) calculator estimates a deposit's maturity amount from the amount, interest rate, tenure and compounding frequency. The AIF calculator projects returns on high-risk, high-reward funds from the amount, horizon, fund type, expected return, management fee and performance fee. My audit of both found the same weaknesses to different degrees: unclear inputs, outputs that were hard to interpret, weak mobile layouts, missing trust signals such as disclaimers and regulatory information, and accessibility gaps in contrast and font size. The AIF calculator was hit hardest. The business problem: an AIF is a large, long-term commitment. If investors can't see what fees will take, they won't trust the number — or invest through the platform.\",\n  success: \"Each calculator should answer its own investor's question: a saver gets a reassuring answer in under 60 seconds; an AIF investor sees exactly what fees take before they commit.\",\n  did: [\"Audited both calculators against six criteria, from input clarity to accessibility.\", \"Ran the competitive analysis across ten FD and AIF tools.\", \"Defined target users, personas and separate design drivers for each calculator.\", \"Designed the mobile UI for both calculators, plus related Held Away screens.\", \"Designed a 35-icon set for the wider Centricity platform.\"],\n  team: \"Product set priorities and release scope. Engineering built the calculators from my designs.\",\n  personaTitle: \"Two calculators, two different users\",\n  personas: [[\"R\", \"Rajesh, 38\", \"FD user · Government employee, Jaipur\", \"A quick answer, in plain words.\", \"Prefers low-risk, stable returns. Confused by compounding and interest frequency, distrusts technical language, and finds bank portals cluttered.\", \"A quick answer, plain words and reassurance before committing.\"], [\"N\", \"Neha, 32\", \"AIF user · Startup founder, Mumbai\", \"Net returns, after every fee.\", \"Invests in mutual funds, startups and real estate. Finds AIF fee structures confusing, hard to compare across platforms, and the data opaque or sales-heavy.\", \"Net returns after fees, fund comparison and scenario simulation.\"]],\n  personaNote: \"FD users: general public, low-to-medium financial literacy, mostly mobile, a simple decision. AIF users: HNIs and advisors, medium-to-high literacy, desktop and tablet preferred, a complex and comparative decision. Treating them as one product would have made the FD calculator too heavy or the AIF calculator too thin.\",\n  painsTitle: \"Where competitors fell short\",\n  pains: [[\"INDmoney\", \"Strong: timeline graphs and learning modules. The strongest mobile experience — the benchmark to beat.\"], [\"Smallcase Wealth\", \"Strong: goal-based projections. Weak: minimal guidance.\"], [\"Julivi\", \"Strong: interactive fee breakdown. Weak: not beginner-friendly, weak mobile.\"], [\"Kristal.AI\", \"Strong: deeply explained, graph and table. Weak: paywalled, aimed only at HNIs.\"], [\"PrimeInvestor\", \"Strong: content-rich. Weak: not visual, data-focused.\"], [\"The gap → the brief\", \"AIF tools are rare, data-heavy and intimidating; fees and scenarios are rarely done well. FD tools are simple but rarely explain growth. I also rated HDFC Bank, SBI, Groww, BankBazaar and ICICI Bank.\"]],\n  driversLabel: \"Design drivers\", driversTitle: \"Separate drivers for each calculator\", driversIntro: \"Five for the Fixed Deposit calculator, five for the AIF calculator.\",\n  drivers: [[\"FD · Simplicity first\", \"Minimal inputs, no jargon.\"], [\"FD · Educate without overloading\", \"Tooltips for terms like quarterly compounding.\"], [\"FD · Visual assurance\", \"Show how the deposit grows over time.\"], [\"FD · Fast and mobile-first\", \"An answer in under 60 seconds.\"], [\"FD · Trust and familiarity\", \"A friendly, conversational tone.\"], [\"AIF · Clarity in complexity\", \"Break returns into fees, returns and net gain.\"], [\"AIF · Interactive and comparative\", \"Side-by-side comparison and simulations.\"], [\"AIF · Data transparency\", \"Show how much goes to fees versus the investor.\"], [\"AIF · Advanced yet intuitive\", \"Cards, sliders and editable tables.\"], [\"AIF · Investor confidence\", \"Breakdowns that keep users in control.\"]],\n  constraints: [\"Fee maths couldn't be simplified away: fixed management fee, admin expenses, hurdle rate, catch-up and performance fee all had to stay accurate and visible.\", \"Mobile-first delivery, even though AIF investors prefer desktop and tablet.\", \"Trust signals such as disclaimers and regulatory information were missing and had to be designed in.\"],\n  hardTitle: \"Gross to net, one fee at a time\",\n  hard: \"The simplest design would show one projected number — exactly what AIF investors already distrusted, because a single figure hides what fees take. I chose to show the whole path: the investor picks a fund category and its components (fixed coupon, warrants), then sees each deduction as its own line — gross return, fixed management fee, other admin expenses, hurdle rate and catch-up, performance fee — down to the net return. It's a longer screen, so I grouped it into editable cards with paired columns for coupon and warrant returns, kept the net figure as the end point, and left every rate editable so investors can test their own assumptions.\",\n  decisions: [[\"05.1\", \"Decision 02 · Scenarios\", \"Compare and stress test, built in\", \"Competitors rarely handled scenarios well, and Neha's persona asked for exactly that. I added an Individual / Compare toggle at the top of the AIF calculator, so funds can be set side by side, and a Stress Test view that shows returns under a downturn. Scenario tools turn a sales figure into something an investor can question — which is what builds trust in a high-risk product.\"], [\"05.2\", \"Decision 03 · Savers\", \"A simpler FD calculator, with a helpful nudge\", \"For savers, I kept the FD calculator to four inputs on sliders, with maturity amount, invested amount and interest shown together. A short nudge suggests increasing the tenure to five years to make the returns tax-free — the kind of guidance bank calculators left out.\"]],\n  didntTitle: \"Trade-offs\", didnt: \"What I gave up, and why.\",\n  tradeoffs: [[\"One shared calculator design\", \"Two designs, because savers and HNI investors make very different decisions.\"], [\"A short, single-number AIF result\", \"A longer breakdown, because transparency is what earns trust.\"], [\"Advanced options on the FD calculator\", \"Keeping it under 60 seconds for its users.\"]],\n  solution: [[\"AIF Calculator\", \"fund category, then expected returns, then every fee deducted in order.\"], [\"Individual mode and stress test\", \"fees deducted step by step, with a stress test showing the return under a downturn.\"], [\"FD Calculator\", \"four slider inputs and a tax-free nudge — deliberately simple.\"], [\"High-fidelity screens\", \"AIF and FD calculators alongside the Held Away investment screens.\"], [\"Dark and light\", \"both calculators across themes.\"]],\n  system: { body: \"Quiet charcoal, off-white and warm sand, with Montserrat in three weights for dense figures. I also designed a 35-icon set for the wider platform — from advisor dashboard and IPS allocation to goal simulation and order punching — so the calculators sit naturally inside Centricity's product.\", swatches: [\"#4C4C4C\", \"#FBFBFB\", \"#B69377\", \"#010101\"], validation: \"One icon language across the calculators, Held Away and the wider Centricity platform.\" },\n  outcome: [\"2 calculators, each designed for its own investor\", \"10 competitor tools benchmarked to find the gap\", \"35 icons designed for the wider platform\", \"+30% task completion across the Centricity products I led UX for\"],\n  differently: \"AIF users told us they prefer desktop and tablet, but this round focused on mobile. Next time I would design the comparison view for larger screens first, where side-by-side funds have room to breathe.\",\n  opinion: \"In finance, a simpler number isn't always a clearer one. Investors trust a result when they can see how it was built.\",\n  note: \"Figures in these screens are placeholder data, used for confidentiality.\",\n  link: null };\nOD.supIndex = 0;\nconst CASES = [...FLAG, OD, INV, AIF];\nconst pad = (i) => String(i + 1).padStart(2, \"0\");\nconst HERO = [[\"Senior\"], [\"Product\"], [\"Designer\"], [\"for\"], [\"AI\", 1], [\"and\"], [\"data-heavy\", 1], [\"B2B\"], [\"SaaS.\"]];\nconst BELIEF = [[\"Complex\"], [\"products\"], [\"don't\"], [\"need\"], [\"more\"], [\"features.\"], [\"They\", 0, 1], [\"need\"], [\"fewer\", 1], [\"decisions\", 1], [\"per\"], [\"screen.\"]];\nconst CHIPS = [[\"Filter ▾\", 12, 14, \"o\"], [\"Export CSV\", 72, 11, \"b\"], [\"+ Add widget\", 42, 8, \"o\"], [\"Settings\", 88, 30, \"o\"], [\"Advanced mode\", 12, 38, \"a\"], [\"Compare\", 86, 54, \"o\"], [\"Sort by\", 16, 66, \"b\"], [\"Bulk edit\", 64, 84, \"o\"], [\"Notifications · 12\", 34, 90, \"o\"], [\"Cu
